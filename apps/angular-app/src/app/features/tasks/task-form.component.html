<form class="task-form" (submit)="handleSubmit($event)" novalidate>
  <h3>{{ isEdit() ? 'Edit task' : 'New task' }}</h3>

  <app-field [controlId]="'task-title'" label="Title" [errors]="fieldErrors('title')">
    <input
      id="task-title"
      [value]="title()"
      (input)="title.set($any($event.target).value); clearError('title')"
      [attr.aria-invalid]="hasError('title')"
      [attr.aria-describedby]="hasError('title') ? 'task-title-error' : null"
    />
  </app-field>

  <app-field
    [controlId]="'task-description'"
    label="Description (optional)"
    [errors]="fieldErrors('description')"
  >
    <textarea
      id="task-description"
      [value]="description()"
      (input)="description.set($any($event.target).value); clearError('description')"
      [attr.aria-invalid]="hasError('description')"
      [attr.aria-describedby]="hasError('description') ? 'task-description-error' : null"
    ></textarea>
  </app-field>

  @if (!isEdit()) {
    <app-field [controlId]="'task-project'" label="Project" [errors]="fieldErrors('projectId')">
      <select
        id="task-project"
        [value]="projectId()"
        (change)="projectId.set($any($event.target).value); clearError('projectId')"
        [attr.aria-invalid]="hasError('projectId')"
        [attr.aria-describedby]="hasError('projectId') ? 'task-project-error' : null"
      >
        <option value="">Select a project</option>
        @for (project of projects(); track project.id) {
          <option [value]="project.id">{{ project.name }}</option>
        }
      </select>
    </app-field>
  }

  <app-field [controlId]="'task-priority'" label="Priority" [errors]="fieldErrors('priority')">
    <select
      id="task-priority"
      [value]="priority()"
      (change)="priority.set($any($event.target).value); clearError('priority')"
      [attr.aria-invalid]="hasError('priority')"
      [attr.aria-describedby]="hasError('priority') ? 'task-priority-error' : null"
    >
      @for (option of priorities; track option) {
        <option [value]="option">{{ option }}</option>
      }
    </select>
  </app-field>

  <app-field
    [controlId]="'task-assignee'"
    label="Assignee (optional)"
    [errors]="fieldErrors('assigneeId')"
  >
    <select
      id="task-assignee"
      [value]="assigneeId()"
      (change)="assigneeId.set($any($event.target).value); clearError('assigneeId')"
      [attr.aria-invalid]="hasError('assigneeId')"
      [attr.aria-describedby]="hasError('assigneeId') ? 'task-assignee-error' : null"
    >
      <option value="">Unassigned</option>
      @for (user of users(); track user.id) {
        <option [value]="user.id">{{ user.name }}</option>
      }
    </select>
  </app-field>

  <div class="form-actions">
    <button type="submit" class="primary">{{ isEdit() ? 'Save changes' : 'Create task' }}</button>
    <button type="button" (click)="cancel.emit()">Cancel</button>
  </div>
</form>
